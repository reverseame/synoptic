starting from core

# core dump program counter
core_program_counter<64> := ${core_program_counter}
# first basic block we are interested in
start_addr<64> := ${start_addr}
# loop exit reached when the input matches
goal_addr<64> := ${goal_addr}

replace core_program_counter by
	${symbolic_data}

	jump at start_addr
end

# print the input buffer (as a little-endian value) for every path that reaches the goal
reach * goal_addr then print @[buffer, ${buffer_length}]

cut at goal_addr
${cut_data}
