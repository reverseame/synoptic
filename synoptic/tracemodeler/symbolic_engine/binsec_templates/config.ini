starting from core

# core dump program counter
core_program_counter<64> := ${core_program_counter}
# first_bbl we are interested
start_addr<64> := ${start_addr}
# set up input buffer
buffer_addr<64> := 0xfffff000000000
# loop tails
goal_addr<64> := ${goal_addr}
cut_addr<64> := ${cut_addr}

replace core_program_counter by
	${symbolic_data}

	jump at start_addr
end

reach * goal_addr then print ascii stream token

cut at goal_addr
cut at cut_addr
